<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AeroAssist — Sign in</title>
  <script>
    // Set the theme attribute before first paint so there is no flash of
    // the wrong theme. Kept tiny and inline on purpose.
    (function () {
      var t = localStorage.getItem('aero_theme');
      if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="stylesheet" href="/assets/app.css">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
</head>
<body>
  <div class="login-wrap">
    <div class="card login-card">
      <div style="text-align:center; margin-bottom: 18px">
        <img src="/assets/brand-logo.svg" alt="dnata — An Emirates Group company" class="brand-logo-lg">
        <h1 style="margin:10px 0 2px">Aero<span style="color:var(--accent-2)">Assist</span></h1>
        <div class="muted small" id="tagline">Airport wheelchair assistance — task manager</div>
      </div>
      <form id="loginForm">
        <label id="lblUser">Username</label>
        <input id="username" autocomplete="username" required autofocus>
        <label id="lblPass">Password</label>
        <input id="password" type="password" autocomplete="current-password" required>
        <div id="error" style="color:var(--red); margin-top:10px; display:none; font-weight:600"></div>
        <button class="primary" style="width:100%; margin-top:18px; padding:13px" type="submit" id="btnLogin">Sign in</button>
      </form>
      <div class="row" style="justify-content:center; margin-top:12px">
        <span id="langHost"></span>
        <span id="themeHost"></span>
      </div>
      <div class="muted small" style="margin-top:16px; text-align:center">
        Demo accounts — admin: <b>admin/admin123</b> · agent: <b>ahmed/agent123</b>
      </div>
      <div style="margin-top:22px; text-align:center; opacity:.9">
        <img src="/assets/emirates-logo.png" alt="Emirates" style="height:52px; display:block; margin:0 auto 4px">
        <div class="muted" style="font-size:10.5px; letter-spacing:.14em; text-transform:uppercase">part of the Emirates Group</div>
      </div>
    </div>
  </div>
  <script type="module">
    import { API } from '/assets/api.js';
    import { t, applyDir, langToggle } from '/assets/i18n.js';
    import { initTheme, themeToggle } from '/assets/theme.js';
    applyDir();
    initTheme();
    langToggle(document.getElementById('langHost'));
    themeToggle(document.getElementById('themeHost'));
    document.getElementById('tagline').textContent = t('tagline');
    document.getElementById('lblUser').textContent = t('username');
    document.getElementById('lblPass').textContent = t('password');
    document.getElementById('btnLogin').textContent = t('sign_in');
    const go = user => location.href = user.role === 'ADMIN' ? '/admin' : '/agent';
    if (API.token && API.user) go(API.user);
    document.getElementById('loginForm').addEventListener('submit', async e => {
      e.preventDefault();
      const err = document.getElementById('error');
      err.style.display = 'none';
      try {
        const user = await API.login(username.value.trim(), password.value);
        go(user);
      } catch (ex) {
        err.textContent = ex.message;
        err.style.display = 'block';
      }
    });
  </script>
</body>
</html>
